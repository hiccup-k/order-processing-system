name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # common-avro must be installed to the local repo first: every other module
      # depends on the Avro-generated classes it produces.
      - name: Build and install common-avro
        run: mvn -B -pl common-avro -am install

      - name: Test order-service
        run: mvn -B -pl order-service -am test

      - name: Test inventory-service
        run: mvn -B -pl inventory-service -am test

      - name: Test notification-service
        run: mvn -B -pl notification-service -am test

      - name: Test api-gateway
        run: mvn -B -pl api-gateway -am test

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.txt"
          retention-days: 5

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build order-service image
        run: docker build -f order-service/Dockerfile -t order-service:ci .

      - name: Build inventory-service image
        run: docker build -f inventory-service/Dockerfile -t inventory-service:ci .

      - name: Build notification-service image
        run: docker build -f notification-service/Dockerfile -t notification-service:ci .

      - name: Build api-gateway image
        run: docker build -f api-gateway/Dockerfile -t api-gateway:ci .
