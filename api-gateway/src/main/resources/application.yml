server:
  port: 8080

spring:
  config:
    import: vault://

  application:
    name: api-gateway
  cloud:
    vault:
      uri: ${VAULT_URI:http://localhost:8200}
      token: ${VAULT_TOKEN}
    gateway:
      routes:
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - StripPrefix=0
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/inventory/**
          filters:
            - StripPrefix=0
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s

security:
  jwt:
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    com.example.gateway: INFO
    org.springframework.cloud.gateway: INFO
